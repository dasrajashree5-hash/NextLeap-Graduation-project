# Railway service config — set the service root directory to `backend/` in the dashboard.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Use Dockerfile CMD (scripts/start.sh). Clear any custom Start Command in the Railway UI
# that uses bare `--port $PORT` without a shell — that passes the literal string "$PORT".
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
