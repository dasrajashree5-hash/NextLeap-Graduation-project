name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Migrate and test
        env:
          DATABASE_URL: sqlite:///./data/ci.db
          CHROMA_PERSIST_DIR: ./data/chroma_ci
          VECTOR_STORE: chroma
          ENVIRONMENT: test
        run: |
          alembic upgrade head
          pytest -q -m "not slow and not live_llm"
          python scripts/check_phase_gates.py --risks --fail-on-incomplete

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install, lint, unit test, build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: |
          npm install
          npm run lint
          npm test
          npm run build
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
      - name: E2E smoke
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run test:e2e
